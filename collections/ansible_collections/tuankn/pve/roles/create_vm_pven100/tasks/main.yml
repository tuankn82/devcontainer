- name: Create cloud VM
  community.general.proxmox_kvm:
    api_host: "{{ api_pven100_combined['host'] }}"
    api_user: "{{ api_pven100_combined['user'] }}"
    api_token_id: "{{ api_pven100_combined['token_id'] }}"
    api_token_secret: "{{ api_pven100_combined['token_secret'] }}"
    validate_certs: "{{ api_pven100_combined['validate_certs'] }}"
    name: "{{ api_create_vm_pven100_values_combined['name'] }}"
    agent: enabled=1
    balloon: "{{ api_create_vm_pven100_values_combined['balloon'] }}"
    boot: order=scsi0
    cipassword: "{{ api_create_vm_pven100_values_combined['cloud_init']['password'] }}"
    ciuser: "{{ api_create_vm_pven100_values_combined['cloud_init']['user'] }}"
    cores: "{{ api_create_vm_pven100_values_combined['cpu_cores'] }}"
    cpu: "{{ api_create_vm_pven100_values_combined['cpu_type'] }}"
    ide:
      ide2: "{{ api_create_vm_pven100_values_combined['cloud_init']['storage']\
        }}:cloudinit,format={{ api_create_vm_pven100_values_combined['cloud_init']['format'] }}"
    ipconfig: "{{ network_config['ipconfig'] }}"
    memory: "{{ api_create_vm_pven100_values_combined['memory'] }}"
    net: "{{ network_config['network'] }}"
    node: "{{ api_create_vm_pven100_values_combined['node'] }}"
    ostype: l26
    # scsi0: "zfs_root:0,import-from=lexar:0/jammy-server-cloudimg-amd64.qcow2,format=qcow2,iothread=1,discard=on,ssd=1"
    scsi: |
      {{
        api_create_vm_pven100_values_combined['disk']
        | tuankn.pve.disk_config(
          image['filename'] | tuankn.pve.qcow2_image_name,
          api_create_vm_pven100_values_combined['image']['storage']
        )
      }}
    scsihw: virtio-scsi-single
    serial:
      serial0: socket
    sshkeys: "{{ api_create_vm_pven100_values_combined['cloud_init']['sshkeys'] }}"
    vga: serial0
    timeout: 300
  register: result
  vars:
    image: "{{ lookup('tuankn.pve.cloud_image', api_create_vm_pven100_values_combined['image']['name']) }}"
    network_config: "{{ api_create_vm_pven100_values_combined['network'] | tuankn.pve.network_config }}"

- name: Save vmid
  ansible.builtin.set_fact:
    api_pven100_vmid: "{{ result['vmid'] }}"

# - name: debug api
#   ansible.builtin.debug:
#     msg: "{{ api_create_vm_pven100_values_combined['disk'][0]['size'] | default(8) }}"

# - name: debug api_pven100_vmid
#   ansible.builtin.debug:
#     msg: "{{ api_pven100_vmid }}"

- name: Resize disk
  community.general.proxmox_disk:
    api_host: "{{ api_pven100_combined['host'] }}"
    api_user: "{{ api_pven100_combined['user'] }}"
    api_token_id: "{{ api_pven100_combined['token_id'] }}"
    api_token_secret: "{{ api_pven100_combined['token_secret'] }}"
    validate_certs: "{{ api_pven100_combined['validate_certs'] }}"
    disk: scsi0
    vmid: "{{ api_pven100_vmid }}"
    size: "{{ api_create_vm_pven100_values_combined['disk'][0]['size'] | default(8) }}G"
    state: resized

- name: Start the VMID
  community.general.proxmox_kvm:
    api_host: "{{ api_pven100_combined['host'] }}"
    api_user: "{{ api_pven100_combined['user'] }}"
    api_token_id: "{{ api_pven100_combined['token_id'] }}"
    api_token_secret: "{{ api_pven100_combined['token_secret'] }}"
    validate_certs: "{{ api_pven100_combined['validate_certs'] }}"
    state: started
    vmid: "{{ api_pven100_vmid }}"
  when: api_create_vm_pven100_start
