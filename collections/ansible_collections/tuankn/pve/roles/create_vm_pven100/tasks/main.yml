---
- name: Register api_proxmox_combined
  ansible.builtin.import_tasks: get_api_pven100_combined.yml

- name: Register values
  ansible.builtin.set_fact:
    api_create_vm_pven100_values_combined: |
      {{
        api_create_vm_pven100_values_defaults
        | ansible.builtin.combine(api_create_vm_pven100_values, recursive=true)
      }}

